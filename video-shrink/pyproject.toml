[project]
name = "video-shrink"
version = "0.1.0"
description = "Non-destructive video compression component for KaruFile"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
video-shrink = "video_shrink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_shrink"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
