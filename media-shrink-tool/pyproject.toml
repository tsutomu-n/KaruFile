[project]
name = "media-shrink"
version = "0.1.0"
description = "Non-destructive image resize and JPEG conversion tool for KaruFile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
media-shrink = "media_shrink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_shrink"]
