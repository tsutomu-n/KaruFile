[project]
name = "excel-shrink"
version = "0.1.0"
description = "Non-destructive embedded-image resizing for selected XLSX workbooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["Pillow>=10.0"]

[project.scripts]
excel-shrink = "excel_shrink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_shrink"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
